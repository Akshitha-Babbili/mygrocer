
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyGrocer | Create Account</title>

  <style>
    :root {
      --ivory: #FAF9F2;
      --forest: #234B3A;
      --sage: #A8BE91;
      --butter: #F0D987;
      --ink: #292E29;
      --white: #FFFFFF;
      --muted: #777D73;
      --border: #E5E7DC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--ivory);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .register-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 10px;
      background: var(--sage);
      border-radius: 19px;
      font-size: 30px;
      transform: rotate(-4deg);
    }

    .brand h1 {
      color: var(--forest);
      font-size: 31px;
      letter-spacing: -1px;
    }

    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .register-card {
      padding: 30px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 23px;
      box-shadow: 0 14px 40px rgba(35, 75, 58, 0.07);
    }

    .register-card h2 {
      color: var(--forest);
      font-size: 23px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FDFDF9;
      color: var(--ink);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(35, 75, 58, 0.09);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--forest);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .message {
      display: none;
      padding: 11px 12px;
      margin-bottom: 16px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #FFF0EC;
      color: #A33D2D;
    }

    .message.success {
      display: block;
      background: #EDF5E8;
      color: var(--forest);
    }

    .register-button {
      width: 100%;
      padding: 13px;
      margin-top: 4px;
      border: none;
      border-radius: 11px;
      background: var(--forest);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .register-button:hover {
      background: #315E49;
      transform: translateY(-1px);
    }

    .register-button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .login-link a {
      color: var(--forest);
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="register-wrapper">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">🥬</div>
      <h1>MyGrocer</h1>
      <p>Less waste, more taste.</p>
    </header>

    <section class="register-card">
      <h2>Create your account</h2>
      <p class="subtitle">
        Start tracking expiry dates and make the most of every grocery.
      </p>

      <div id="message" class="message" role="alert"
           aria-live="polite"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            autocomplete="name"
            maxlength="60"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Create password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button
              type="button"
              class="toggle-password"
              data-target="password"
            >Show</button>
          </div>
          <span class="hint">Use at least 8 characters.</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Enter password again"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button
              type="button"
              class="toggle-password"
              data-target="confirmPassword"
            >Show</button>
          </div>
        </div>

        <button type="submit" class="register-button" id="registerButton">
          Create account →
        </button>
      </form>

      <p class="login-link">
        Already registered?
        <a href="index.html">Sign in</a>
      </p>
    </section>

    <p class="footer-note">
      🌱 Your fresher kitchen starts here.
    </p>
  </main>

  <script>
    "use strict";

    const registerForm = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const registerButton = document.getElementById("registerButton");
    const messageBox = document.getElementById("message");

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    // Must match index.html exactly.
    async function hashPassword(password) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error(
          "Secure password hashing is unavailable. Open this page using localhost."
        );
      }

      const encoded = new TextEncoder().encode(password);
      const digest = await crypto.subtle.digest("SHA-256", encoded);

      return Array.from(new Uint8Array(digest))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", function () {
        const target = document.getElementById(button.dataset.target);
        const isHidden = target.type === "password";

        target.type = isHidden ? "text" : "password";
        button.textContent = isHidden ? "Hide" : "Show";
      });
    });

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearMessage();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (name.length < 2) {
        showMessage("Please enter a name with at least 2 characters.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = "Creating account...";

      try {
        const existingData = localStorage.getItem("mygrocer_user");

        if (existingData) {
          let existingUser;

          try {
            existingUser = JSON.parse(existingData);
          } catch {
            showMessage(
              "Saved account data is invalid. Clear the MyGrocer account data before registering again.",
              "error"
            );
            return;
          }

          if (
            existingUser &&
            typeof existingUser.email === "string" &&
            existingUser.email.trim()
          ) {
            showMessage(
              "An account already exists in this browser. Please sign in instead.",
              "error"
            );
            return;
          }

          showMessage(
            "Saved account data is invalid. Please check browser storage before registering.",
            "error"
          );
          return;
        }

        const passwordHash = await hashPassword(password);

        const user = {
          name: name,
          email: email,
          passwordHash: passwordHash
        };

        localStorage.setItem("mygrocer_user", JSON.stringify(user));

        // Do not automatically sign in; use the login page.
        showMessage(
          "Account created successfully! Redirecting to sign in...",
          "success"
        );

        registerButton.textContent = "Account created";

        setTimeout(function () {
          window.location.href = "index.html";
        }, 1200);

      } catch (error) {
        showMessage(
          error.message || "Could not create your account. Please try again.",
          "error"
        );
      } finally {
        if (registerButton.textContent !== "Account created") {
          registerButton.disabled = false;
          registerButton.textContent = "Create account →";
        }
      }
    });
  </script>
</body>
</html>
