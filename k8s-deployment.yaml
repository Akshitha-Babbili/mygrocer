
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mygrocer-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mygrocer
  template:
    metadata:
      labels:
        app: mygrocer
    spec:
      containers:
        - name: mygrocer
          image: mygrocer-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
