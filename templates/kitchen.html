<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyGrocer — Kitchen Inventory</title>
<style>
  :root{
    --ivory:#FAF9F2; --forest:#234B3A; --sage:#A8BE91;
    --butter:#F0D987; --ink:#292E29; --white:#ffffff;
    --danger:#B23A2E; --muted:#6B756B;
    --shadow:0 8px 24px rgba(35,75,58,.10);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--ivory); color:var(--ink); min-height:100vh;
  }
  header.top{
    background:var(--forest); color:var(--ivory);
    padding:16px 24px; display:flex; align-items:center; gap:16px;
    box-shadow:var(--shadow); position:sticky; top:0; z-index:5;
  }
  header.top .logo{font-size:1.25rem; font-weight:800; letter-spacing:.4px}
  header.top .logo span{color:var(--butter)}
  nav.links{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
  nav.links a{
    color:var(--ivory); text-decoration:none; padding:8px 12px; border-radius:10px;
    font-size:.9rem; opacity:.9; transition:background .15s;
  }
  nav.links a:hover{background:rgba(255,255,255,.12)}
  nav.links a.active{background:var(--sage); color:var(--forest); font-weight:700; opacity:1}
  nav.links button{
    background:transparent; color:var(--ivory); border:1px solid rgba(255,255,255,.4);
    padding:8px 12px; border-radius:10px; cursor:pointer; font-size:.9rem;
  }
  nav.links button:hover{background:rgba(255,255,255,.12)}

  main.wrap{max-width:1100px; margin:0 auto; padding:32px 24px 60px}
  h1{margin:0 0 6px; color:var(--forest); font-size:1.7rem}
  .sub{margin:0 0 24px; color:var(--muted)}

  form.add{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px; display:grid; gap:12px; grid-template-columns:2fr 1fr 1.4fr auto;
    align-items:end; margin-bottom:24px;
  }
  form.add label{display:block; font-weight:600; font-size:.85rem; margin-bottom:6px}
  form.add input{
    width:100%; padding:11px 12px; font-size:1rem;
    border:1.5px solid #dfe4dc; border-radius:12px; outline:none;
    background:#fff; color:var(--ink); transition:border .15s, box-shadow .15s;
  }
  form.add input:focus{border-color:var(--sage); box-shadow:0 0 0 3px rgba(168,190,145,.35)}
  button.primary{
    background:var(--forest); color:var(--ivory); border:0; border-radius:12px;
    padding:12px 18px; font-weight:700; cursor:pointer; font-size:.95rem;
    transition:background .15s;
  }
  button.primary:hover{background:#1b3b2d}
  button.primary[disabled]{opacity:.6; cursor:wait}

  .msg{min-height:20px; margin:0 0 18px; font-size:.9rem; border-radius:10px; padding:10px 12px; display:none}
  .msg.show{display:block}
  .msg.error{background:#fdeceb; color:var(--danger); border:1px solid #f2c6c1}
  .msg.ok{background:#eaf3e4; color:var(--forest); border:1px solid #cfe0c0}

  .list{display:grid; gap:14px}
  .item{
    background:var(--white); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px;
    border-left:6px solid var(--sage);
    display:grid; grid-template-columns:1.6fr .7fr 1fr 1fr auto;
    gap:12px; align-items:center;
  }
  .item.expired{border-left-color:var(--danger); background:#fdf6f5}
  .item.soon{border-left-color:var(--butter); background:#fffbea}
  .item.used{opacity:.6}
  .item input, .item select{
    width:100%; padding:8px 10px; font-size:.95rem;
    border:1.5px solid #dfe4dc; border-radius:10px; outline:none;
    background:#fff; color:var(--ink);
  }
  .item input:focus, .item select:focus{border-color:var(--sage)}
  .item .meta{font-size:.75rem; color:var(--muted); margin-top:4px}
  .item .actions{display:flex; gap:6px}
  .item .actions button{
    border:1.5px solid #dfe4dc; background:#fff; border-radius:10px;
    padding:8px 10px; cursor:pointer; font-size:.9rem; color:var(--ink);
    transition:background .15s;
  }
  .item .actions button:hover{background:#f3f5ef}
  .item .actions button.danger{color:var(--danger); border-color:#f2c6c1}
  .item .actions button.danger:hover{background:#fdeceb}
  .item .actions button.save{color:var(--forest); border-color:var(--sage); font-weight:700}

  .empty{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:36px; text-align:center; color:var(--muted);
  }
  .empty .icon{font-size:2rem; margin-bottom:8px}

  @media (max-width:820px){
    form.add{grid-template-columns:1fr 1fr}
    form.add button.primary{grid-column:1 / -1}
    .item{grid-template-columns:1fr 1fr}
    .item .actions{grid-column:1 / -1; justify-content:flex-end}
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">🌿 MyGrocer<span>.</span></div>
  <nav class="links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/kitchen.html" class="active">Kitchen</a>
    <a href="/shopping.html">Shopping</a>
    <button id="logoutBtn" type="button">Sign out</button>
  </nav>
</header>

<main class="wrap">
  <h1>Kitchen Inventory</h1>
  <p class="sub">Track what you own. Edit any field, then press Save.</p>

  <form class="add" id="addForm" novalidate>
    <div>
      <label for="newName">Item name</label>
      <input id="newName" type="text" maxlength="150" placeholder="e.g. Tomatoes" required />
    </div>
    <div>
      <label for="newQty">Quantity</label>
      <input id="newQty" type="number" min="1" max="999" value="1" required />
    </div>
    <div>
      <label for="newExp">Expiry (optional)</label>
      <input id="newExp" type="date" />
    </div>
    <button class="primary" type="submit" id="addBtn">Add item</button>
  </form>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="list" class="list" aria-live="polite"></div>
</main>

<script>
(function () {
  "use strict";

  function getCookie(name) {
    const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign(
      { "Accept": "application/json" },
      opts.headers || {}
    );
    const method = (opts.method || "GET").toUpperCase();
    if (opts.body) headers["Content-Type"] = "application/json";
    if (method !== "GET" && method !== "HEAD") {
      headers["X-CSRFToken"] = getCookie("XSRF-TOKEN");
    }
    const res = await fetch(path, {
      method,
      headers,
      credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data };
  }

  const msg = document.getElementById("msg");
  function show(kind, text) {
    msg.textContent = text || "";
    msg.className = text ? "msg show " + kind : "msg";
  }
  function clearMsg() { msg.className = "msg"; msg.textContent = ""; }

  const listEl = document.getElementById("list");

  function daysUntil(iso) {
    if (!iso) return null;
    const exp = new Date(iso + "T00:00:00");
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((exp - today) / 86400000);
  }

  function renderItems(items) {
    listEl.replaceChildren();
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      const ic = document.createElement("div");
      ic.className = "icon"; ic.textContent = "🧺";
      const t = document.createElement("div");
      t.textContent = "Nothing in your kitchen yet. Add your first item above.";
      empty.append(ic, t);
      listEl.appendChild(empty);
      return;
    }

    items.forEach(function (it) {
      const row = document.createElement("div");
      row.className = "item";
      const d = daysUntil(it.expiry_date);
      if (it.status === "expired" || (d !== null && d < 0)) row.classList.add("expired");
      else if (d !== null && d <= 3) row.classList.add("soon");
      if (it.status === "used") row.classList.add("used");

      const nameCell = document.createElement("div");
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = it.item_name;
      nameInput.maxLength = 150;
      nameInput.setAttribute("aria-label", "Item name");
      const meta = document.createElement("div");
      meta.className = "meta";
      if (d === null) meta.textContent = "No expiry set";
      else if (d < 0) meta.textContent = "Expired " + Math.abs(d) + " day(s) ago";
      else if (d === 0) meta.textContent = "Expires today";
      else meta.textContent = "Expires in " + d + " day(s)";
      nameCell.append(nameInput, meta);

      const qtyCell = document.createElement("div");
      const qtyInput = document.createElement("input");
      qtyInput.type = "number"; qtyInput.min = "1"; qtyInput.max = "999";
      qtyInput.value = it.quantity;
      qtyInput.setAttribute("aria-label", "Quantity");
      qtyCell.appendChild(qtyInput);

      const expCell = document.createElement("div");
      const expInput = document.createElement("input");
      expInput.type = "date";
      expInput.value = it.expiry_date || "";
      expInput.setAttribute("aria-label", "Expiry date");
      expCell.appendChild(expInput);

      const statCell = document.createElement("div");
      const statSel = document.createElement("select");
      statSel.setAttribute("aria-label", "Status");
      ["active", "used", "expired"].forEach(function (v) {
        const o = document.createElement("option");
        o.value = v; o.textContent = v.charAt(0).toUpperCase() + v.slice(1);
        if (v === it.status) o.selected = true;
        statSel.appendChild(o);
      });
      statCell.appendChild(statSel);

      const actions = document.createElement("div");
      actions.className = "actions";

      const saveBtn = document.createElement("button");
      saveBtn.type = "button"; saveBtn.className = "save";
      saveBtn.textContent = "Save";
      saveBtn.addEventListener("click", async function () {
        clearMsg();
        saveBtn.disabled = true;
        try {
          const r = await api("/api/groceries/" + it.id, {
            method: "PATCH",
            body: {
              item_name: nameInput.value.trim(),
              quantity: Number(qtyInput.value),
              expiry_date: expInput.value || null,
              status: statSel.value,
            },
          });
          if (r.ok) {
            show("ok", "Saved.");
            await load();
          } else if (r.status === 401) {
            window.location.assign("/");
          } else {
            show("error", (r.data && r.data.error) || "Could not save.");
          }
        } catch (e) {
          show("error", "Network error while saving.");
        } finally {
          saveBtn.disabled = false;
        }
      });

      const delBtn = document.createElement("button");
      delBtn.type = "button"; delBtn.className = "danger";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", async function () {
        if (!window.confirm('Delete "' + it.item_name + '"?')) return;
        clearMsg();
        delBtn.disabled = true;
        try {
          const r = await api("/api/groceries/" + it.id, { method: "DELETE" });
          if (r.ok) { show("ok", "Deleted."); await load(); }
          else if (r.status === 401) window.location.assign("/");
          else show("error", (r.data && r.data.error) || "Could not delete.");
        } catch (e) {
          show("error", "Network error while deleting.");
        } finally {
          delBtn.disabled = false;
        }
      });

      actions.append(saveBtn, delBtn);
      row.append(nameCell, qtyCell, expCell, statCell, actions);
      listEl.appendChild(row);
    });
  }

  async function load() {
    clearMsg();
    try {
      const r = await api("/api/groceries");
      if (r.status === 401) { window.location.assign("/"); return; }
      if (!r.ok) { show("error", "Could not load groceries."); return; }
      renderItems(r.data.items || []);
    } catch (e) {
      show("error", "Network error while loading.");
    }
  }

  const addForm = document.getElementById("addForm");
  const addBtn = document.getElementById("addBtn");
  addForm.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    clearMsg();
    const name = document.getElementById("newName").value.trim();
    const qty = Number(document.getElementById("newQty").value);
    const exp = document.getElementById("newExp").value || null;

    if (!name) { show("error", "Item name is required."); return; }
    if (!Number.isInteger(qty) || qty < 1 || qty > 999) {
      show("error", "Quantity must be a whole number between 1 and 999."); return;
    }

    addBtn.disabled = true;
    try {
      const r = await api("/api/groceries", {
        method: "POST",
        body: { item_name: name, quantity: qty, expiry_date: exp },
      });
      if (r.status === 401) { window.location.assign("/"); return; }
      if (r.ok) {
        addForm.reset();
        document.getElementById("newQty").value = "1";
        show("ok", "Added.");
        await load();
      } else {
        show("error", (r.data && r.data.error) || "Could not add item.");
      }
    } catch (e) {
      show("error", "Network error while adding.");
    } finally {
      addBtn.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async function () {
    try { await api("/api/logout", { method: "POST" }); } catch (e) {}
    window.location.assign("/");
  });

  load();
})();
</script>
</body>
</html>
