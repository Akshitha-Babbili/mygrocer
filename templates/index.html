<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyGrocer — Sign in</title>
<style>
  :root{
    --ivory:#FAF9F2; --forest:#234B3A; --sage:#A8BE91;
    --butter:#F0D987; --ink:#292E29; --white:#ffffff;
    --danger:#B23A2E; --muted:#6B756B;
    --shadow:0 8px 24px rgba(35,75,58,.10);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--ivory); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .shell{
    width:100%; max-width:980px;
    display:grid; grid-template-columns:1.1fr 1fr;
    background:var(--white); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .brand{
    background:
      radial-gradient(circle at 80% 15%, rgba(240,217,135,.55), transparent 55%),
      radial-gradient(circle at 15% 85%, rgba(168,190,145,.55), transparent 55%),
      var(--forest);
    color:var(--ivory);
    padding:44px 36px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .brand h1{margin:0; font-size:2rem; letter-spacing:.5px}
  .brand .tag{margin:10px 0 0; opacity:.9; font-size:1rem}
  .brand .leaf{font-size:2.2rem; margin-bottom:14px}
  .brand ul{padding-left:18px; margin:20px 0 0; line-height:1.9; opacity:.92}
  .brand .foot{font-size:.85rem; opacity:.75; margin-top:24px}
  .panel{padding:44px 36px; display:flex; flex-direction:column; justify-content:center}
  h2{margin:0 0 6px; color:var(--forest); font-size:1.5rem}
  .sub{margin:0 0 24px; color:var(--muted); font-size:.95rem}
  label{display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px}
  .pw-wrap{position:relative}
  input[type=email], input[type=password]{
    width:100%; padding:12px 44px 12px 14px; font-size:1rem;
    border:1.5px solid #dfe4dc; border-radius:12px; background:#fff;
    color:var(--ink); outline:none; transition:border .15s, box-shadow .15s;
  }
  input[type=email]{padding-right:14px}
  input:focus{border-color:var(--sage); box-shadow:0 0 0 3px rgba(168,190,145,.35)}
  .toggle{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    border:0; background:transparent; cursor:pointer; font-size:1.05rem;
    color:var(--forest); padding:6px; border-radius:8px;
  }
  .toggle:focus-visible{outline:2px solid var(--sage)}
  .row{display:flex; align-items:center; justify-content:space-between; margin:16px 0 8px}
  .remember{display:flex; align-items:center; gap:8px; font-size:.9rem; color:var(--muted)}
  .remember input{accent-color:var(--forest); width:16px; height:16px}
  button.primary{
    width:100%; margin-top:12px; padding:13px; font-size:1rem; font-weight:700;
    background:var(--forest); color:var(--ivory); border:0; border-radius:12px;
    cursor:pointer; transition:background .15s, transform .05s;
  }
  button.primary:hover{background:#1b3b2d}
  button.primary:active{transform:translateY(1px)}
  button.primary[disabled]{opacity:.7; cursor:wait}
  .msg{min-height:20px; margin-top:14px; font-size:.9rem; border-radius:10px; padding:10px 12px; display:none}
  .msg.show{display:block}
  .msg.error{background:#fdeceb; color:var(--danger); border:1px solid #f2c6c1}
  .msg.ok{background:#eaf3e4; color:var(--forest); border:1px solid #cfe0c0}
  .alt{margin-top:20px; font-size:.9rem; color:var(--muted); text-align:center}
  .alt a{color:var(--forest); font-weight:600; text-decoration:none}
  .alt a:hover{text-decoration:underline}
  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .brand{padding:28px}
    .brand ul{display:none}
  }
</style>
</head>
<body>
<main class="shell" role="main">
  <section class="brand">
    <div>
      <div class="leaf" aria-hidden="true">🌿</div>
      <h1>MyGrocer</h1>
      <p class="tag">Less waste, more taste.</p>
      <ul>
        <li>Track what's in your kitchen</li>
        <li>Catch expiries before they spoil</li>
        <li>Shop smarter with a shared list</li>
      </ul>
    </div>
    <p class="foot">© MyGrocer</p>
  </section>

  <section class="panel">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to keep your kitchen in order.</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@example.com" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="••••••••" required />
        <button class="toggle" type="button" id="pwToggle"
                aria-label="Show password" aria-pressed="false">👁</button>
      </div>

      <div class="row">
        <label class="remember" for="remember">
          <input id="remember" type="checkbox" /> Remember me on this device
        </label>
      </div>

      <button class="primary" type="submit" id="submitBtn">Sign in</button>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>

    <p class="alt">New to MyGrocer? <a href="/register.html">Create an account</a></p>
  </section>
</main>

<script>
(function () {
  "use strict";

  function getCookie(name) {
    const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : "";
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign(
      { "Accept": "application/json" },
      opts.headers || {}
    );
    const method = (opts.method || "GET").toUpperCase();
    if (opts.body) headers["Content-Type"] = "application/json";
    if (method !== "GET" && method !== "HEAD") {
      headers["X-CSRFToken"] = getCookie("XSRF-TOKEN");
    }
    const res = await fetch(path, {
      method,
      headers,
      credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data };
  }

  const form = document.getElementById("loginForm");
  const emailEl = document.getElementById("email");
  const pwEl = document.getElementById("password");
  const rememberEl = document.getElementById("remember");
  const toggle = document.getElementById("pwToggle");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");

  function show(kind, text) {
    msg.textContent = text;
    msg.className = "msg show " + kind;
  }
  function clearMsg() { msg.className = "msg"; msg.textContent = ""; }

  toggle.addEventListener("click", function () {
    const showing = pwEl.type === "text";
    pwEl.type = showing ? "password" : "text";
    toggle.setAttribute("aria-pressed", String(!showing));
    toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    toggle.textContent = showing ? "👁" : "🙈";
    pwEl.focus();
  });

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    clearMsg();

    const email = emailEl.value.trim();
    const password = pwEl.value;
    if (!email) { show("error", "Please enter your email."); emailEl.focus(); return; }
    if (!password) { show("error", "Please enter your password."); pwEl.focus(); return; }

    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Signing in…";

    try {
      const r = await api("/api/login", {
        method: "POST",
        body: { email: email, password: password, remember: rememberEl.checked },
      });

      if (r.ok) {
        show("ok", "Signed in. Redirecting…");
        window.location.assign("/dashboard.html");
        return;
      }

      if (r.status === 401) {
        show("error", "Invalid email or password.");
      } else if (r.status === 403) {
        show("error", "Your session expired. Refresh the page and try again.");
      } else if (r.data && r.data.error) {
        show("error", r.data.error);
      } else {
        show("error", "Something went wrong. Please try again.");
      }
    } catch (err) {
      show("error", "Network error. Check your connection and try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });
})();
</script>
</body>
</html>
